name: ZYVON AI CI

concurrency:
  group: zyvon-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://zyvon:zyvon_ci_password@localhost:5432/zyvon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @zyvon/database db:validate
      - name: Generate Prisma client
        run: pnpm --filter @zyvon/database db:generate
      - name: Build API
        run: pnpm --filter @zyvon/api build
      - name: Run API validation tests
        run: pnpm --filter @zyvon/api test
      - name: Build web app
        run: pnpm --filter @zyvon/web build
