name: ZYVON AI CI

concurrency:
  group: zyvon-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zyvon
          POSTGRES_PASSWORD: zyvon_ci_password
          POSTGRES_DB: zyvon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zyvon -d zyvon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://zyvon:zyvon_ci_password@localhost:5432/zyvon_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm --filter @zyvon/database db:validate
      - name: Generate Prisma client
        run: pnpm --filter @zyvon/database db:generate
      - name: Sync schema to PostgreSQL
        run: pnpm --filter @zyvon/database db:push
      - name: Build API
        run: pnpm --filter @zyvon/api build
      - name: Run API validation tests
        run: pnpm --filter @zyvon/api test
      - name: Run PostgreSQL integration tests
        run: pnpm --filter @zyvon/api test:integration
      - name: Build web app
        run: pnpm --filter @zyvon/web build
      - name: Typecheck mobile app
        run: pnpm --filter @zyvon/mobile typecheck
      - name: Export Android app bundle
        run: pnpm --filter @zyvon/mobile exec expo export --platform android
      - name: Export iOS app bundle
        run: pnpm --filter @zyvon/mobile exec expo export --platform ios

      - name: Build API Docker image
        run: docker build -f apps/api/Dockerfile -t zyvon-api:ci .
      - name: Build web Docker image
        run: docker build -f apps/web/Dockerfile -t zyvon-web:ci .
